<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>개항기 복습 강의 (11/21)</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0b1220;color:#fff;font-family:'Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#wrap{display:flex;flex-direction:column;height:100%}
#vp{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#box{position:relative;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:radial-gradient(1200px 700px at 85% -10%,#2b3f7a 0,#14213d 55%,#0d1527 100%);overflow:hidden}
.tag{position:absolute;left:56px;top:30px;background:#ffc93c;color:#2a2340;font-weight:800;font-size:26px;padding:6px 18px;border-radius:999px}
.dots{position:absolute;right:56px;top:48px;display:flex;gap:8px}
.dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.22)}
.dots i.on{background:#ffc93c}.dots i.done{background:#7fd6b7}
h1{position:absolute;left:56px;top:84px;right:56px;font-size:50px;line-height:1.15;font-weight:900;letter-spacing:-1px}
.sub{position:absolute;left:58px;top:146px;font-size:24px;color:#aeb9dd}
#items{position:absolute;left:56px;right:56px;top:192px;bottom:122px;display:flex;flex-direction:column;gap:9px;justify-content:flex-start}
.it{background:rgba(255,255,255,.09);border-left:8px solid #5b8cff;border-radius:14px;padding:9px 20px;font-size:31px;line-height:1.3;font-weight:700;opacity:.62}
.it.cur{opacity:1;background:rgba(255,255,255,.17);border-left-color:#ffc93c}
.it.mn{border-left-color:#ef4d8a;color:#ffd0e2}.it.mn.cur{background:rgba(239,77,138,.28)}
.it.q{border-left-color:#7fd6b7;font-size:42px}.it.a{border-left-color:#ffc93c;font-size:46px;color:#ffe28a;background:rgba(255,201,60,.16);opacity:1}
.it.long{font-size:27px}
#sub{position:absolute;left:0;right:0;bottom:0;height:112px;background:rgba(0,0,0,.66);display:flex;align-items:center;justify-content:center;text-align:center;padding:0 60px;font-size:32px;line-height:1.38;font-weight:700;word-break:keep-all}
#sub.off{display:none}
.big #items{top:290px}
#bar{background:#111a2e;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
#bar button,#bar select{height:46px;min-width:46px;border-radius:12px;border:0;background:#26355c;color:#fff;font:700 16px system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;padding:0 14px;touch-action:manipulation}
#bar button.main{background:#ef4d8a;min-width:84px;font-size:20px}
#bar button.on{background:#ffc93c;color:#2a2340}
#bar select{max-width:42vw}
#prog{width:100%;height:6px;background:#26355c;border-radius:3px;overflow:hidden}#prog b{display:block;height:100%;background:#ffc93c;width:0}
#hint{width:100%;text-align:center;font-size:13px;color:#8e9bc4}
#start{position:absolute;inset:0;background:rgba(8,12,24,.72);display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;z-index:5}
#start button{font:900 44px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#ef4d8a;color:#fff;border:0;border-radius:28px;padding:22px 50px}
#start p{font-size:26px;color:#cdd6f5}
.still #bar,.still #start{display:none}
</style></head><body>
<div id="wrap"><div id="vp"><div id="box"><div id="stage">
 <div class="tag" id="tag"></div><div class="dots" id="dots"></div>
 <h1 id="h"></h1><div class="sub" id="s"></div>
 <div id="items"></div><div id="sub"></div>
 <div id="start"><button id="go">▶ 강의 시작</button><p id="vm">소리가 나요 · 자막도 같이 나와요</p></div>
</div></div></div>
<div id="bar">
 <div id="prog"><b></b></div>
 <button id="pv">⏮</button><button id="pp" class="main">▶</button><button id="nx">⏭</button>
 <select id="sp"><option value="0.8">느리게 0.8×</option><option value="0.95" selected>보통 0.95×</option><option value="1.15">빠르게 1.15×</option></select>
 <select id="vo"></select>
 <button id="snd" class="on">🔊 소리</button><button id="cc" class="on">자막</button>
 <select id="sc"></select>
</div></div>
<script>
const SCENES=[
{tag:'11월 21일 · 개항기',h:'개항기 한 번에 복습',sub:'흥선대원군 ~ 경술국치, 44년의 이야기',steps:[
 {say:'안녕하세요! 오늘은 11월 21일 개항기 수업 내용을 처음부터 끝까지 한 번에 복습해 볼게요.'},
 {say:'흥선대원군부터 경술국치까지, 1866년에서 1910년, 딱 44년의 이야기예요. 이야기처럼 편하게 따라와요.',items:['① 흥선대원군 · 서양과의 충돌','② 강화도 조약 · 임오군란 · 갑신정변','③ 동학농민운동 ~ 경술국치']},
]},
{tag:'연표 복습',h:'먼저, 지난 연표 빠르게 훑기',sub:'선사시대 → 조선',steps:[
 {say:'먼저 연표부터 빠르게 훑어요. 구석기에는 뗀석기를 쓰고 동굴에서 살며 채집과 사냥을 했어요. 신석기에는 간석기를 쓰고, 농사를 시작하고, 움집에 살았죠.',items:['구석기 → 뗀석기 · 동굴 · 채집과 사냥','신석기 → 간석기 · 농사 시작 · 움집']},
 {say:'청동기에는 고인돌이 생기고 계급이 나타났어요. 철기 시대에는 부여, 고구려, 옥저, 동예, 삼한이 있었고요.',items:['청동기 → 고인돌 · 계급','철기 → 부여 · 고구려 · 옥저 · 동예 · 삼한']},
 {say:'삼국 시대에는 광개토 대왕과 장수왕, 근초고왕, 진흥왕이 전성기를 이끌었어요. 남북국 시대에는 통일신라와 발해가 함께 있었고, 발해는 대조영이 세웠죠.',items:['삼국 → 광개토 대왕·장수왕 / 근초고왕 / 진흥왕','남북국 → 통일신라 + 발해(대조영)']},
 {say:'후삼국에서는 견훤과 궁예가 나라를 세웠고, 고려는 왕건이 세웠어요. 호족과 원 간섭기가 기억할 말이에요. 마지막으로 조선은 이성계가 세웠죠.',items:['후삼국 → 견훤 · 궁예','고려 → 왕건 · 호족 · 원 간섭기','조선 → 이성계']},
 {say:'그리고 이 연표의 끝에서 오늘의 개항기가 시작돼요. 오늘의 암기 문장이에요. 병제병 오신척, 강화도 임, 갑거동, 청동갑을, 아독대, 러을정. 소리 내서 한 번 읽어 봐요!',items:['※ 병제병 오신척 · 강화도 임 · 갑거동','※ 청동갑을 · 아독대 · 러을정'],wait:3},
]},
{tag:'① 흥선대원군',h:'흥선대원군의 개혁',sub:'고종이 어릴 때 아버지가 나라를 이끎',steps:[
 {say:'이야기는 1866년에 시작돼요. 고종이 아직 어려서, 아버지 흥선대원군이 나라를 이끌었어요. 대원군은 세 가지 개혁을 했어요.'},
 {say:'첫째, 서원 철폐. 서원은 붕당의 근거지였기 때문에 없애 버렸어요.',items:['서원 철폐 → 붕당의 근거지를 없앰']},
 {say:'둘째, 경복궁을 다시 지었어요. 그런데 돈이 모자라서 당백전을 발행했어요.',items:['경복궁 중건 → 돈이 모자라 당백전 발행']},
 {say:'셋째, 삼정의 문란을 바로잡았어요. 전정은 양전 사업, 군정은 호포제라고 해서 양반에게도 군포를 걷었고, 환곡은 사창제로 고쳤어요.',items:['전정 → 양전 사업','군정 → 호포제 (양반도 군포)','환곡 → 사창제']},
]},
{tag:'① 흥선대원군',h:'병제병 · 오신척',sub:'서양과의 충돌',steps:[
 {say:'대원군은 서양에 문을 굳게 닫았어요. 그러니 충돌이 이어졌죠. 주문은 병제병 오신척이에요. 하나씩 가 볼게요.'},
 {say:'병! 병인박해, 1866년. 천주교 신자와 프랑스 신부를 처형했어요.',items:['병인박해 (1866) → 천주교 신자·프랑스 신부 처형']},
 {say:'제! 제너럴셔먼호 사건, 1866년. 대동강에 온 미국 배를 불태웠어요. 이때 평양 관찰사가 박규수예요.',items:['제너럴셔먼호 (1866) → 미국 배를 불태움 (박규수)']},
 {say:'병! 병인양요, 1866년. 프랑스가 강화도를 공격했어요. 양헌수는 정족산성에서, 한성근은 문수산성에서 싸웠고, 프랑스는 외규장각 도서를 약탈했어요.',items:['병인양요 (1866) → 양헌수(정족산성) · 한성근(문수산성) / 외규장각 도서 약탈']},
 {say:'오! 오페르트 도굴 사건, 1868년. 흥선대원군의 아버지 남연군의 무덤을 파헤치려 했어요.',items:['오페르트 도굴 사건 (1868) → 남연군 묘']},
 {say:'신! 신미양요, 1871년. 미국이 강화도를 공격했고, 어재연 장군이 광성보에서 맞서 싸웠어요.',items:['신미양요 (1871) → 어재연 · 광성보']},
 {say:'척! 척화비예요. 서양과 화해하자는 것은 나라를 파는 것이라며 통상 수교를 거부했어요.',items:['척화비 → 통상 수교 거부']},
]},
{tag:'② 개항',h:'강화도 조약 (1876)',sub:'강제로 열린 문 · 불평등 조약',steps:[
 {say:'이제 대원군이 물러나고 고종이 직접 나라를 다스려요. 1875년에 일본이 운요호 사건을 일으키고, 그걸 핑계로 조약을 강요했어요. 이게 1876년 강화도 조약, 불평등 조약이에요.'},
 {say:'첫째, 조선은 자주국이라고 적었어요. 청의 간섭을 끊으려는 일본의 속셈이었죠.',items:['① “조선은 자주국” → 청의 간섭을 끊으려는 속셈']},
 {say:'둘째, 항구 세 곳을 열었어요. 부산, 원산, 인천이에요.',items:['② 3개 항구 개항 → 부산 · 원산 · 인천']},
 {say:'셋째, 일본에게 해안 측량권을 줬어요.',items:['③ 일본에게 해안 측량권']},
 {say:'넷째, 치외 법권. 일본인이 죄를 지어도 일본 법으로 재판했어요. 부속 조약으로는 무관세와 양곡 무제한 유출까지 있었어요.',items:['④ 치외 법권 → 일본인은 일본 법으로 재판','부속 조약 → 무관세 · 양곡 무제한 유출']},
]},
{tag:'② 개항',h:'임오군란 (1882)',sub:'“임오는 청포도를 좋아해”',steps:[
 {say:'개화 정책으로 통리기무아문을 만들고 신식 군대인 별기군을 키웠어요.',items:['개화 정책 → 통리기무아문 · 별기군']},
 {say:'반대로 구식 군인들은 차별을 받았어요. 월급이 밀리고, 겨우 받은 쌀에는 모래가 섞여 있었죠. 화가 난 군인들이 일으킨 게 임오군란이에요.',items:['구식 군인 차별 → 밀린 월급 · 모래 섞인 쌀 → 군란']},
 {say:'결과는 이 문장으로 외워요. 임오는 청포도를 좋아해. 청은 조청상민수륙무역장정, 포는 제물포 조약이에요. 청의 간섭이 더 심해졌어요.',items:['※ 임오는 청포도를 좋아해','청 → 조청상민수륙무역장정','포 → 제물포 조약 (일본)']},
]},
{tag:'② 개항',h:'갑신정변 (1884)',sub:'3일 천하 · 거문도 사건',steps:[
 {say:'청의 간섭이 심해지자 김옥균과 박영효 같은 급진 개화파가 우정총국 개국 축하연에서 정변을 일으켰어요.',items:['김옥균 · 박영효 (급진 개화파) → 우정총국 개국 축하연']},
 {say:'하지만 청군이 진압해서 딱 3일 만에 끝났어요. 그래서 3일 천하라고 불러요.',items:['청군이 진압 → 3일 천하']},
 {say:'그 뒤 일본과는 한성 조약을 맺었고, 청과 일본은 톈진 조약을 맺었어요. 조선에 군대를 보낼 때는 서로 알리자는 내용이에요. 이게 나중에 청일전쟁의 불씨가 돼요.',items:['한성 조약 (일본)','톈진 조약 (청·일) → 군대 파견 시 서로 알리기 → 청일전쟁의 불씨']},
 {say:'1885년에는 거문도 사건이 있었어요. 영국이 러시아를 막는다며 거문도를 불법으로 차지했어요.',items:['거문도 사건 (1885) → 영국의 거문도 불법 점령']},
 {say:'암기 문장으로 보면 강화도 임, 갑거동이에요. 강화도 조약, 임오군란, 그리고 갑신정변, 거문도, 동학이죠.'},
]},
{tag:'③ 동학 ~ 경술국치',h:'동학농민운동 (1894)',sub:'녹두장군 전봉준',steps:[
 {say:'1894년, 전봉준과 농민들이 고부 군수의 횡포에 맞서 일어났어요. 동학농민운동이에요.',items:['전봉준 → 고부 군수의 횡포에 맞섬']},
 {say:'황토현 전투에서 농민군이 처음 이겼고, 황룡촌 전투에서 두 번째로 이겨서 전주성을 점령했어요.',items:['황토현 전투 → 첫 승리','황룡촌 전투 → 두 번째 승리 → 전주성 점령']},
 {say:'그러자 청과 일본 군대가 들어왔고, 청일전쟁이 일어나서 일본이 이겼어요.',items:['청·일 군대 들어옴 → 청일전쟁 → 일본 승리']},
]},
{tag:'③ 동학 ~ 경술국치',h:'청동갑을 · 아독대',sub:'1894 ~ 1897',steps:[
 {say:'이제 주문 청동갑을 아독대예요. 청은 청일전쟁, 동은 동학농민운동 2차 봉기예요. 이때 농민군은 우금치 전투에서 패배했어요.',items:['청 · 동 → 청일전쟁 (1894) · 동학 2차 봉기 → 우금치 전투 패배']},
 {say:'갑은 갑오개혁이에요. 신분제와 과거제가 폐지됐어요.',items:['갑 → 갑오개혁 (1894) → 신분제·과거제 폐지']},
 {say:'을은 을미사변, 1895년. 일본이 명성황후를 시해했어요. 이어서 을미개혁으로 단발령이 내려졌고, 반발해서 을미의병이 일어났어요.',items:['을 → 을미사변 (1895) → 명성황후 시해 → 을미개혁(단발령) → 을미의병']},
 {say:'아는 아관파천, 1896년. 고종이 러시아 공사관으로 피신했어요.',items:['아 → 아관파천 (1896) → 러시아 공사관']},
 {say:'독은 독립협회. 서재필이 만들었고, 독립문과 독립신문이 있어요.',items:['독 → 독립협회 (1896) → 서재필 · 독립문 · 독립신문']},
 {say:'마지막 대는 대한제국, 1897년. 고종이 황제에 즉위했고 광무개혁을 했어요.',items:['대 → 대한제국 (1897) → 고종 황제 즉위 · 광무개혁']},
]},
{tag:'③ 동학 ~ 경술국치',h:'러을정 · 나라를 빼앗기다',sub:'1904 ~ 1910',steps:[

const Q=new URLSearchParams(location.search),STILL=Q.has('s');
if(STILL)document.body.classList.add('still');
const $=i=>document.getElementById(i);
let si=0,ki=0,playing=false,tok=0,timer=null,rate=.95,sound=true,voice=null,hasKo=false;
const total=SCENES.reduce((a,s)=>a+s.steps.length,0);
function items(s,k){let L=[];for(let i=0;i<=k;i++){const st=s.steps[i];if(st.reset)L=[];(st.items||[]).forEach(t=>L.push({t,n:i===k}))}return L}
function cls(t,s,st){let c='it';if(t.startsWith('※'))c+=' mn';if(/^Q\d/.test(t))c+=' q';if(/^A\./.test(t))c+=' a';if(t.length>34)c+=' long';return c}
function render(a,b){si=a;ki=b;const s=SCENES[a],st=s.steps[b];
 $('tag').textContent=s.tag;$('h').textContent=s.h;$('s').textContent=s.sub||'';
 $('dots').innerHTML=SCENES.map((_,i)=>`<i class="${i<a?'done':i==a?'on':''}"></i>`).join('');
 const L=items(s,b);
 $('items').innerHTML=L.map(o=>`<div class="${cls(o.t)}${o.n?' cur':''}">${o.t.replace(/^※\s*/,'')}</div>`).join('');
 $('sub').textContent=st.say;
 let done=0;for(let i=0;i<a;i++)done+=SCENES[i].steps.length;
 $('prog').firstChild.style.width=((done+b+1)/total*100)+'%';
 $('sc').value=a}
function dur(st){return Math.max(2,st.say.length*.19/rate+1)+(st.wait||0)}
function say(st,cb){const my=++tok;clearTimeout(timer);speechSynthesis&&speechSynthesis.cancel();
 const fin=()=>{if(my!==tok)return;clearTimeout(timer);timer=setTimeout(()=>{if(my===tok)cb()},(st.wait||0)*1000+450)};
 if(sound&&hasKo&&window.speechSynthesis){
  const u=new SpeechSynthesisUtterance(st.say);u.lang='ko-KR';if(voice)u.voice=voice;u.rate=rate;u.pitch=1.08;
  u.onend=fin;u.onerror=()=>{if(my===tok){timer=setTimeout(()=>{if(my===tok)cb()},dur(st)*1000)}};
  setTimeout(()=>{if(my===tok)speechSynthesis.speak(u)},60);
  timer=setTimeout(()=>{if(my===tok){speechSynthesis.cancel();cb()}},(st.say.length*.45/rate+8+(st.wait||0))*1000);
 }else timer=setTimeout(()=>{if(my===tok)cb()},dur(st)*1000)}
function step(){render(si,ki);if(!playing)return;say(SCENES[si].steps[ki],()=>{if(ki+1<SCENES[si].steps.length)ki++;else if(si+1<SCENES.length){si++;ki=0}else{playing=false;$('pp').textContent='↺';tok++;return}step()})}
function play(){playing=true;$('pp').textContent='⏸';step()}
function pause(){playing=false;tok++;clearTimeout(timer);window.speechSynthesis&&speechSynthesis.cancel();$('pp').textContent='▶'}
function jump(a,b){const was=playing;tok++;clearTimeout(timer);window.speechSynthesis&&speechSynthesis.cancel();si=a;ki=b;if(was)step();else render(a,b)}
$('pp').onclick=()=>{if($('pp').textContent==='↺'){si=0;ki=0}playing?pause():play()};
$('go').onclick=()=>{$('start').style.display='none';play()};
$('nx').onclick=()=>{if(si+1<SCENES.length)jump(si+1,0)};
$('pv').onclick=()=>{ki>0?jump(si,0):si>0&&jump(si-1,0)};
$('sp').onchange=e=>{rate=+e.target.value;if(playing)jump(si,ki)};
$('snd').onclick=e=>{sound=!sound;e.target.classList.toggle('on',sound);e.target.textContent=sound?'🔊 소리':'🔇 소리 끔';if(playing)jump(si,ki)};
$('cc').onclick=e=>{const on=$('sub').classList.toggle('off');e.target.classList.toggle('on',!on)};
$('sc').innerHTML=SCENES.map((s,i)=>`<option value="${i}">${i}. ${s.h}</option>`).join('');
$('sc').onchange=e=>jump(+e.target.value,0);
document.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();$('pp').click()}if(e.key==='ArrowRight')$('nx').click();if(e.key==='ArrowLeft')$('pv').click()});
function loadVoices(){const all=window.speechSynthesis?speechSynthesis.getVoices():[];const ko=all.filter(v=>/^ko/i.test(v.lang)||/korea|한국/i.test(v.name));
 hasKo=ko.length>0;$('vo').style.display=hasKo?'':'none';
 ko.sort((a,b)=>(/yuna|유나|female|여/i.test(b.name)?1:0)-(/yuna|유나|female|여/i.test(a.name)?1:0));
 $('vo').innerHTML=ko.map((v,i)=>`<option value="${i}">${v.name.replace(/Google /,'')}</option>`).join('');voice=ko[0]||null;$('vo').onchange=e=>{voice=ko[+e.target.value];if(playing)jump(si,ki)};
 $('vm').textContent=hasKo?'🔊 기기의 한국어 목소리로 읽어 줘요 · 자막도 같이 나와요':'이 기기에서는 한국어 목소리를 못 찾아서 자막으로 진행돼요'}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}else loadVoices();
function fit(){const bar=$('bar').offsetHeight||0,W=innerWidth,H=innerHeight-(STILL?0:bar);const k=Math.min(W/1280,H/720);$('stage').style.transform=`scale(${k})`;$('box').style.width=1280*k+'px';$('box').style.height=720*k+'px'}
addEventListener('resize',fit);fit();setTimeout(fit,200);
$('stage').addEventListener('click',e=>{if(e.target.closest('#start'))return;if(!STILL)$('pp').click()});
if(STILL)render(+Q.get('s'),+Q.get('k'));else render(0,0);
window.__SC=SCENES;
</script></body></html>
